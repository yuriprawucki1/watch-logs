name: Release on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out delivered commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Synchronize lockfile
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --include=dev --ignore-scripts --no-audit --no-fund
          release_sha="${GITHUB_SHA}"
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore(security): synchronize npm lockfile'
            git push origin HEAD:main
            release_sha="$(git rev-parse HEAD)"
          fi
          printf 'release_sha=%s\n' "${release_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create or verify GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.lockfile.outputs.release_sha }}
        shell: bash
        run: |
          set -euo pipefail

          api="${API_URL}/repos/${REPOSITORY}"
          auth_header="$(printf '%s: %s %s' 'Authorization' 'Bearer' "${GITHUB_TOKEN}")"
          accept_header="Accept: application/vnd.github+json"
          tag="v$(jq -er '.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' package.json)"

          get_json() {
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -H "${auth_header}" -H "${accept_header}" "$1"
          }

          status_code() {
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H "${auth_header}" -H "${accept_header}" "$1"
          }

          resolve_tag_commit() {
            local tag_ref tag_type tag_sha tag_object object_type
            tag_ref="$(get_json "${api}/git/ref/tags/${tag}")"
            tag_type="$(jq -er '.object.type' <<<"${tag_ref}")"
            tag_sha="$(jq -er '.object.sha' <<<"${tag_ref}")"
            if [ "${tag_type}" != "tag" ]; then
              echo "Tag ${tag} is not annotated." >&2
              return 1
            fi
            tag_object="$(get_json "${api}/git/tags/${tag_sha}")"
            object_type="$(jq -er '.object.type' <<<"${tag_object}")"
            if [ "${object_type}" != "commit" ]; then
              echo "Annotated tag ${tag} does not resolve to a commit." >&2
              return 1
            fi
            tag_sha="$(jq -er '.object.sha' <<<"${tag_object}")"
            printf '%s' "${tag_sha}"
          }

          tag_status="$(status_code "${api}/git/ref/tags/${tag}")"
          if [ "${tag_status}" = "200" ]; then
            tagged_sha="$(resolve_tag_commit)"
            release_status="$(status_code "${api}/releases/tags/${tag}")"
            if [ "${release_status}" = "200" ] && [ "${tagged_sha}" = "${RELEASE_SHA}" ]; then
              release_json="$(get_json "${api}/releases/tags/${tag}")"
              jq -e --arg tag "${tag}" --arg sha "${RELEASE_SHA}" \
                '.tag_name == $tag and .draft == false and .prerelease == false and (.target_commitish == $sha or .target_commitish == "main" or .target_commitish == "master")' \
                <<<"${release_json}" >/dev/null
              echo "Release ${tag} already exists for the delivered commit."
              exit 0
            fi
            echo "Tag ${tag} already exists with an unexpected target or release state." >&2
            exit 1
          fi
          if [ "${tag_status}" != "404" ]; then
            echo "Unexpected tag lookup status: ${tag_status}" >&2
            exit 1
          fi

          body="$(printf '%s\n' \
            "Security release ${tag} for commit ${RELEASE_SHA}." \
            '' \
            '### Changes' \
            '- Hardened Graylog query filters, Basic Auth parsing, host validation, and request limits.' \
            '- Updated vulnerable npm dependencies and made Docker installs lockfile-based.' \
            '- Added automated regression tests, a typecheck command, and a non-mutating lint command.' \
            '' \
            '### Verification' \
            '- npm audit: 0 findings; Grype lockfile and installed tree: 0 matches.' \
            '- Tests, lint, typecheck, build, and smoke checks passed locally.' \
            '' \
            '### Residual risk' \
            '- This project is release-only; deploy, production health, and rollback are not applicable.')"

          tag_object_payload="$(jq -n \
            --arg tag "${tag}" \
            --arg message "${body}" \
            --arg sha "${RELEASE_SHA}" \
            '{tag: $tag, message: $message, object: $sha, type: "commit"}')"
          tag_object="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST \
            -H "${auth_header}" -H "${accept_header}" \
            -H 'Content-Type: application/json' \
            --data "${tag_object_payload}" \
            "${api}/git/tags")"
          tag_object_sha="$(jq -er '.sha' <<<"${tag_object}")"
          ref_payload="$(jq -n \
            --arg ref "refs/tags/${tag}" \
            --arg sha "${tag_object_sha}" \
            '{ref: $ref, sha: $sha}')"
          created_ref="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST \
            -H "${auth_header}" -H "${accept_header}" \
            -H 'Content-Type: application/json' \
            --data "${ref_payload}" \
            "${api}/git/refs")"
          jq -e --arg ref "refs/tags/${tag}" --arg sha "${tag_object_sha}" \
            '.ref == $ref and .object.type == "tag" and .object.sha == $sha' \
            <<<"${created_ref}" >/dev/null

          payload="$(jq -n \
            --arg tag "${tag}" \
            --arg sha "${RELEASE_SHA}" \
            --arg body "${body}" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body, draft: false, prerelease: false}')"
          created_release="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST \
            -H "${auth_header}" -H "${accept_header}" \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "${api}/releases")"
          jq -e --arg tag "${tag}" --arg sha "${RELEASE_SHA}" \
            '.tag_name == $tag and .draft == false and .prerelease == false and (.target_commitish == $sha or .target_commitish == "main" or .target_commitish == "master")' \
            <<<"${created_release}" >/dev/null

          verified_release="$(get_json "${api}/releases/tags/${tag}")"
          jq -e --arg tag "${tag}" --arg sha "${RELEASE_SHA}" \
            '.tag_name == $tag and .draft == false and .prerelease == false and (.target_commitish == $sha or .target_commitish == "main" or .target_commitish == "master")' \
            <<<"${verified_release}" >/dev/null

          tagged_sha="$(resolve_tag_commit)"
          if [ "${tagged_sha}" != "${RELEASE_SHA}" ]; then
            echo "Created tag ${tag} does not point to delivered commit." >&2
            exit 1
          fi
          echo "Published release ${tag} for ${RELEASE_SHA}."
