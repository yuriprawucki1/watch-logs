name: Validate and release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out complete history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Create, recover, or verify release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          api="${API_URL}/repos/${REPOSITORY}"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          accept_header='Accept: application/vnd.github+json'
          api_version_header='X-GitHub-Api-Version: 2026-03-10'
          version="$(jq -er '.version | select(type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' package.json)"
          tag="v${version}"

          get_json() {
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              -H "${auth_header}" -H "${accept_header}" -H "${api_version_header}" "$1"
          }

          status_code() {
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --retry 3 --retry-all-errors \
              -H "${auth_header}" -H "${accept_header}" -H "${api_version_header}" "$1"
          }

          post_json() {
            curl --fail --silent --show-error --retry 3 --retry-delay 1 \
              --retry-max-time 20 -X POST \
              -H "${auth_header}" -H "${accept_header}" -H "${api_version_header}" \
              -H 'Content-Type: application/json' --data "$2" "$1"
          }

          resolve_tag_commit() {
            local tag_ref tag_type tag_sha tag_object object_type
            tag_ref="$(get_json "${api}/git/ref/tags/${tag}")"
            tag_type="$(jq -er '.object.type' <<<"${tag_ref}")"
            tag_sha="$(jq -er '.object.sha' <<<"${tag_ref}")"
            if [ "${tag_type}" != 'tag' ]; then
              echo "Tag ${tag} is not annotated." >&2
              return 1
            fi

            tag_object="$(get_json "${api}/git/tags/${tag_sha}")"
            object_type="$(jq -er '.object.type' <<<"${tag_object}")"
            if [ "${object_type}" != 'commit' ]; then
              echo "Annotated tag ${tag} does not resolve directly to a commit." >&2
              return 1
            fi

            jq -er '.object.sha' <<<"${tag_object}"
          }

          verify_release() {
            jq -e --arg tag "${tag}" --arg sha "${tagged_sha}" \
              '.tag_name == $tag and .draft == false and .prerelease == false and (.target_commitish == $sha or .target_commitish == "main" or .target_commitish == "master")' \
              <<<"$1" >/dev/null
          }

          tag_status="$(status_code "${api}/git/ref/tags/${tag}")"
          if [ "${tag_status}" = '200' ]; then
            if ! tagged_sha="$(resolve_tag_commit)"; then
              echo "Could not resolve existing tag ${tag}." >&2
              exit 1
            fi
            if ! git cat-file -e "${tagged_sha}^{commit}" || \
              ! git merge-base --is-ancestor "${tagged_sha}" "${RELEASE_SHA}"; then
              echo "Existing tag ${tag} does not point to a commit in this main history." >&2
              exit 1
            fi

            release_status="$(status_code "${api}/releases/tags/${tag}")"
            if [ "${release_status}" = '200' ]; then
              release_json="$(get_json "${api}/releases/tags/${tag}")"
              if ! verify_release "${release_json}"; then
                echo "Existing release ${tag} does not match its published tag." >&2
                exit 1
              fi
              echo "Release ${tag} is already published at ${tagged_sha}; skipping duplicate release."
              exit 0
            fi
            if [ "${release_status}" != '404' ]; then
              echo "Unexpected release lookup status: ${release_status}" >&2
              exit 1
            fi
            echo "Tag ${tag} exists without a release; completing the interrupted release."
          elif [ "${tag_status}" = '404' ]; then
            release_status="$(status_code "${api}/releases/tags/${tag}")"
            if [ "${release_status}" = '200' ]; then
              echo "Release ${tag} exists without its Git tag; refusing to replace or retarget it." >&2
              exit 1
            fi
            if [ "${release_status}" != '404' ]; then
              echo "Unexpected release lookup status: ${release_status}" >&2
              exit 1
            fi

            latest_tag="$(git tag --list 'v*' --sort=-version:refname | awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && !found { print; found = 1 }')"
            if [ -n "${latest_tag}" ]; then
              latest_version="${latest_tag#v}"
              greatest_version="$(printf '%s\n%s\n' "${latest_version}" "${version}" | sort -V | tail -n 1)"
              if [ "${greatest_version}" != "${version}" ] || \
                [ "${version}" = "${latest_version}" ]; then
                echo "Version ${version} is not newer than the latest release ${latest_tag}." >&2
                exit 1
              fi
            fi

            tag_object_payload="$(jq -n \
              --arg tag "${tag}" \
              --arg message "Release ${tag} at ${RELEASE_SHA}." \
              --arg sha "${RELEASE_SHA}" \
              '{tag: $tag, message: $message, object: $sha, type: "commit"}')"
            if ! tag_object="$(post_json "${api}/git/tags" "${tag_object_payload}")"; then
              echo "GitHub could not create the annotated tag object for ${tag}." >&2
              exit 1
            fi

            tag_object_sha="$(jq -er '.sha' <<<"${tag_object}")"
            ref_payload="$(jq -n \
              --arg ref "refs/tags/${tag}" \
              --arg sha "${tag_object_sha}" \
              '{ref: $ref, sha: $sha}')"
            if ! post_json "${api}/git/refs" "${ref_payload}" >/dev/null; then
              echo "Tag creation did not return success; checking whether GitHub created it." >&2
            fi
            if ! tagged_sha="$(resolve_tag_commit)"; then
              echo "GitHub does not contain a valid tag ${tag} after creation." >&2
              exit 1
            fi
            if [ "${tagged_sha}" != "${RELEASE_SHA}" ]; then
              echo "Tag ${tag} points to ${tagged_sha}, expected ${RELEASE_SHA}." >&2
              exit 1
            fi
          else
            echo "Unexpected tag lookup status: ${tag_status}" >&2
            exit 1
          fi

          release_payload="$(jq -n \
            --arg tag "${tag}" \
            --arg sha "${tagged_sha}" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, draft: false, prerelease: false, generate_release_notes: true}')"
          if created_release="$(post_json "${api}/releases" "${release_payload}")"; then
            if ! verify_release "${created_release}"; then
              echo "GitHub created a release with an unexpected state for ${tag}." >&2
              exit 1
            fi
          else
            echo "Release creation did not return success; checking whether GitHub created it." >&2
            release_status="$(status_code "${api}/releases/tags/${tag}")"
            if [ "${release_status}" != '200' ]; then
              echo "GitHub did not publish release ${tag} (status ${release_status})." >&2
              exit 1
            fi
            created_release="$(get_json "${api}/releases/tags/${tag}")"
            if ! verify_release "${created_release}"; then
              echo "The existing release ${tag} does not match the expected tag." >&2
              exit 1
            fi
          fi

          verified_release="$(get_json "${api}/releases/tags/${tag}")"
          if ! verify_release "${verified_release}"; then
            echo "Release ${tag} failed final verification." >&2
            exit 1
          fi
          verified_tag_sha="$(resolve_tag_commit)"
          if [ "${verified_tag_sha}" != "${tagged_sha}" ]; then
            echo "Tag ${tag} changed during release creation." >&2
            exit 1
          fi
          echo "Release ${tag} is published and verified at ${tagged_sha}."
