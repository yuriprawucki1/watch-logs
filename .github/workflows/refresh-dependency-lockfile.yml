name: Refresh dependency lockfile

on:
  push:
    branches:
      - fix/watch-logs-dependency-audit-20260921

permissions:
  contents: write

concurrency:
  group: refresh-dependency-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Regenerate and commit package lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          api="${API_URL}/repos/${REPOSITORY}"
          auth="Authorization: Bearer ${GITHUB_TOKEN}"
          accept="Accept: application/vnd.github+json"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          get_json() {
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -H "${auth}" -H "${accept}" "$1"
          }
          package_json="$(get_json "${api}/contents/package.json?ref=${REF}")"
          lock_json="$(get_json "${api}/contents/package-lock.json?ref=${REF}")"
          jq -er '.content | select(type == "string")' <<<"${package_json}" | tr -d '\n' | base64 --decode > "${tmp}/package.json"
          jq -er '.content | select(type == "string")' <<<"${lock_json}" | tr -d '\n' | base64 --decode > "${tmp}/package-lock.json"
          (
            cd "${tmp}"
            npm install --package-lock-only --include=dev --ignore-scripts --no-audit --no-fund
          )
          if cmp -s "${tmp}/package-lock.json" <(jq -er '.content | select(type == "string")' <<<"${lock_json}" | tr -d '\n' | base64 --decode); then
            echo "Lockfile already synchronized."
            exit 0
          fi
          content="$(base64 -w0 "${tmp}/package-lock.json")"
          sha="$(jq -er '.sha' <<<"${lock_json}")"
          payload="$(jq -n --arg message "fix(security): refresh npm lockfile" --arg content "${content}" --arg branch "${REF}" --arg sha "${sha}" '{message: $message, content: $content, branch: $branch, sha: $sha}')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X PUT -H "${auth}" -H "${accept}" -H 'Content-Type: application/json' \
            --data "${payload}" "${api}/contents/package-lock.json" >/dev/null
          echo "Updated package-lock.json on ${REF}."
