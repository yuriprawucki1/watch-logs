name: Synchronize release lockfile

on:
  push:
    branches:
      - chore/watch-logs-release-1.0.3

permissions:
  contents: write

concurrency:
  group: synchronize-release-lockfile
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Synchronize package lockfile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          cd "${tmp}"
          git init --quiet
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --quiet --depth=1 origin "refs/heads/${REF}"
          git checkout --quiet FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm install --package-lock-only --include=dev --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git add package-lock.json
          git commit --quiet -m 'chore(release): synchronize npm lockfile'
          git push --quiet origin "HEAD:refs/heads/${REF}"
          echo "Synchronized package-lock.json on ${REF}."
